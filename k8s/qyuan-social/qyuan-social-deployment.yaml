apiVersion: apps/v1
kind: Deployment
metadata:
  name: qyuan-social
  namespace: qyuan
  labels:
    app: qyuan-social
spec:
  replicas: 2
  selector:
    matchLabels:
      app: qyuan-social
  template:
    metadata:
      labels:
        app: qyuan-social
    spec:
      containers:
        - name: qyuan-social
          image: qyuan-social:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9001
          env:
            - name: NACOS_IP
              value: "nacos-service"
            - name: NACOS_PORT
              value: "8848"
            - name: NACOS_NAMESPACE
              value: "public"
            - name: SPRING_PROFILES_ACTIVE
              value: "dev"
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
