services:
  redis:
    image: redis:7-alpine
    container_name: qyuan-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    networks:
      - default
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  qyuan-paper-rd:
    build: .
    container_name: qyuan-paper-rd
    ports:
      - "8080:8080"
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DATABASE: 0
      JAVA_OPTS: "-Xmx512m -Xms256m"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - default
    restart: unless-stopped

networks:
  default:
    driver: bridge

volumes:
  redis-data:
    driver: local
