# Spring Boot DevTools 配置文件
# 禁用某些不需要热重载的触发器
restart.exclude.patterns=spring-boot-starter.*,spring-boot-autoconfigure.*,spring-boot-actuator.*,spring-boot-devtools.*

# 配置排除的静态资源
restart.exclude.static=/static/**,/public/**,/resources/**,/META-INF/resources/**

# 启用触发文件
spring.devtools.restart.trigger-file=.restarttrigger

# 配置轮询间隔（毫秒）
spring.devtools.restart.poll-interval=1000

# 配置安静期（毫秒）- 避免频繁重启
spring.devtools.restart.quiet-period=400