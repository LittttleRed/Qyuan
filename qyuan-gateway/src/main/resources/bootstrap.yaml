spring:
  profiles:
    active: dev
server:
  port: 9003

---
# development environment
spring:
  config:
    activate:
      on-profile: dev
  application:
    name: gateway
  cloud:
    nacos:
      discovery:
        ip: qyuan-gateway-service.default.svc.cluster.local
        server-addr: nacos.default.svc.cluster.local:8848
        namespace: c0d42ad8-9d65-4b0a-aa97-1af2c0d0a3f8
        group: Qyuan
        username: nacos
        password: QianYuanWanMa_18
      config:
        server-addr: nacos.default.svc.cluster.local:8848
        namespace: c0d42ad8-9d65-4b0a-aa97-1af2c0d0a3f8
        file-extension: yaml
        group: Qyuan
        timeout: 10000
        username: nacos
        password: QianYuanWanMa_18
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: false
      routes:
        - id: user-service-route
          uri: lb://qyuan-user
          predicates:
            - Path=/user/**

        - id: read-notes-service-route
          uri: lb://qyuan-read-notes
          predicates:
            - Path=/read_notes/**

        - id: social-service-route
          uri: lb://qyuan-social
          predicates:
            - Path=/social/**

        - id: es-service-route
          uri: lb://qyuan-es
          predicates:
            - Path=/es/**

        - id: paper-rd-service-route
          uri: lb://qyuan-paper-RD
          predicates:
            - Path=/paper/**

        - id: manage-service-route
          uri: lb://qyuan-manage
          predicates:
            - Path=/manage/**

        - id: order-service-route
          uri: lb://qyuan-order
          predicates:
            - Path=/order/**

        - id: ai-service-route
          uri: lb://qyuan-ai
          predicates:
            - Path=/rag/**

demo:
  gateway:
    auth:
      exclude-method-paths:
        - method: GET
          paths:
            # product 相关路径
            - /es/**
            - /paper/patents/**
            - /paper/files/**
            - /paper/papers/**
            - /paper/contents/**
            - /user/auth/**
        - method: POST
          paths:
            - /es/**
            - /paper/patents/**
            - /paper/files/**
            - /paper/papers/**
            - /paper/contents/**
            - /user/auth/**